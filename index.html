<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connecting Prototype</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        background: #ffffff !important;
        display: block;
      }
      #error-message {
        display: none;
        position: absolute;
        inset: 0;
        padding: 24px;
        background: rgba(255, 255, 255, 0.95);
        color: #111;
        font-family: system-ui, sans-serif;
        z-index: 999;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="error-message">
      <h1 style="margin-top:0;">Game failed to load</h1>
      <pre id="error-text" style="white-space:pre-wrap; word-break:break-word;"></pre>
    </div>
    <script>
      window.showGameError = function (message) {
        var errorMessage = document.getElementById('error-message');
        var errorText = document.getElementById('error-text');
        if (errorMessage && errorText) {
          errorText.textContent = message;
          errorMessage.style.display = 'block';
        }
      };
      window.addEventListener('error', function (event) {
        window.showGameError(event.message + '\n' + event.filename + ':' + event.lineno + ':' + event.colno);
      });
      window.addEventListener('unhandledrejection', function (event) {
        window.showGameError(event.reason && event.reason.stack ? event.reason.stack : String(event.reason));
      });
    </script>
    <script src="./phaser.min.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
